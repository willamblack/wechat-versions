name: Wechat Dest Version

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force create release (ignore version checks)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  save_new_wechat:
    runs-on: macOS-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check new version and push
        env: 
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_RELEASE: ${{ github.event.inputs.force_release }}
        run: python3 ./scripts/destVersionForMac.py

      - name: Update numerically sorted release index
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 ./scripts/build_release_index.py
          if ! git diff --quiet -- RELEASES.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add RELEASES.md
            git commit -m "Update release index"
            git push
          fi
